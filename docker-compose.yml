version: '3.8'

services:
  sentinelx:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinelx-siem-engine
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
    volumes:
      - ./backend/sentinelx.db:/app/backend/sentinelx.db
    restart: unless-stopped
